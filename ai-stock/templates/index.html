<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣股票專業分析師</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .report-content { white-space: pre-wrap; font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900">
    <div class="container mx-auto px-4 py-8">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold text-indigo-700 mb-2">🇹🇼 台灣股票專業分析師</h1>
            <p class="text-gray-600">輸入股票代號，獲取專業技術分析與趨勢報告</p>
        </header>

        <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-md mb-8">
            <form action="/analyze" method="POST" class="flex gap-4">
                <input type="text" name="symbol" placeholder="例如: 2330" class="flex-1 p-2 border rounded-md focus:ring-2 focus:ring-indigo-500 outline-none" required>
                <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded-md hover:bg-indigo-700 transition">分析股票</button>
            </form>
        </div>

        {% if symbol %}
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-8">
                <div class="bg-white p-6 rounded-lg shadow-md">
                    <h2 class="text-2xl font-semibold mb-4 text-indigo-600">股價走勢圖 (1年)</h2>
                    <div>
                        {{ chart_html | safe }}
                    </div>
                </div>
                
                <div class="bg-white p-6 rounded-lg shadow-md">
                    <h2 class="text-2xl font-semibold mb-4 text-indigo-600">專業分析報告</h2>
                    <div class="report-content text-lg leading-relaxed">
                        {{ report | safe }}
                    </div>
                </div>
            </div>

            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-lg shadow-md">
                    <h2 class="text-2xl font-semibold mb-4 text-indigo-600">近期新聞資訊 (錢經網)</h2>
                    <ul class="space-y-4">
                        {% for item in news %}
                            <li class="border-b pb-2">
                                <a href="{{ item.link }}" target="_blank" class="text-indigo-500 hover:underline font-medium">
                                    {{ item.title }}
                                </a>
                            </li>
                        {% endfor %}
                        {% if not news %}
                            <li class="text-gray-500 italic">尚未搜尋到相關新聞</li>
                        {% endif %}
                    </ul>
                </div>
            </div>
        </div>
        {% endif %}
    </div>
</body>
</html>
